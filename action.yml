name: 'OSS Action'
description: 'Upload assets to aliyun OSS'
branding:
  icon: 'upload-cloud'
  color: 'yellow'
inputs:
  region:
    description: 'OSS region'
    required: false
  endpoint:
    description: 'OSS endpoint'
    required: false
  key-id:
    description: 'OSS access key ID'
    required: true
  key-secret:
    description: 'OSS access key secret'
    required: true
  bucket:
    description: 'OSS bucket name'
    required: true
  assets:
    description: 'Source and destination upload rules'
    required: true
  timeout:
    description: 'Upload timeout in seconds'
    required: false
    default: '600'
  show-progress:
    description: 'Output upload progress'
    required: false
    default: 'false'
  secure:
    description: 'Use HTTPS for OSS requests'
    required: false
    default: 'true'
outputs:
  url:
    description: oss url
runs:
  using: 'node24'
  main: 'lib/index.js'
